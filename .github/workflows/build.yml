name: Build

# Every push and pull request runs the tests. Pushing a version tag (e.g. v1.0.1) also publishes a GitHub release
# with gci.exe and gci.exe.sha256, which is what the in-app updater looks for.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Test
        run: dotnet test Gci.sln -c Release

      - name: Publish single-file exe
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          dotnet publish src/Gci.App -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=$version -o publish
          $hash = (Get-FileHash publish/gci.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$PWD/publish/gci.exe.sha256", "$hash  gci.exe`n")
          "gci.exe SHA-256: $hash" >> $env:GITHUB_STEP_SUMMARY

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' publish/gci.exe publish/gci.exe.sha256 `
            --title 'GCI ${{ github.ref_name }}' --notes-from-tag --verify-tag

  # Builds and tests the cross-platform (Avalonia) app on macOS every push, and on a version tag attaches the
  # GCI.app bundles to the same GitHub release the Windows job creates. Needs the Windows job so the release exists.
  macos:
    runs-on: macos-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      # The WPF app (Gci.App) is Windows-only, so build just the portable pieces here, not the whole solution.
      - name: Test Gci.Core on macOS
        run: dotnet test tests/Gci.Core.Tests -c Release

      - name: Build the cross-platform app for macOS (arm64 + x64)
        run: |
          dotnet publish src/Gci.Desktop -c Release -r osx-arm64 --self-contained -o build/osx-arm64
          dotnet publish src/Gci.Desktop -c Release -r osx-x64  --self-contained -o build/osx-x64

      # Wrap each publish in a real GCI.app so it's one double-clickable app instead of ~100 loose files. Unsigned for
      # now (Phase 5 adds signing/notarization), so first launch still needs a one-time Gatekeeper override — but only
      # once for the whole app, not per library.
      - name: Assemble .app bundles
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in ''|*[!0-9.]*) VERSION=0.0.0 ;; esac
          bundle() {
            arch="$1"; app="build/pkg-$arch/GCI.app"; contents="$app/Contents"
            mkdir -p "$contents/MacOS" "$contents/Resources"
            cp -R "build/osx-$arch/." "$contents/MacOS/"
            chmod +x "$contents/MacOS/gci"
            printf '%s\n' \
              '<?xml version="1.0" encoding="UTF-8"?>' \
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
              '<plist version="1.0"><dict>' \
              '<key>CFBundleName</key><string>GCI</string>' \
              '<key>CFBundleDisplayName</key><string>GCI</string>' \
              '<key>CFBundleIdentifier</key><string>com.mrjamesroe.gci</string>' \
              '<key>CFBundleExecutable</key><string>gci</string>' \
              '<key>CFBundlePackageType</key><string>APPL</string>' \
              "<key>CFBundleShortVersionString</key><string>$VERSION</string>" \
              "<key>CFBundleVersion</key><string>$VERSION</string>" \
              '<key>LSMinimumSystemVersion</key><string>11.0</string>' \
              '<key>NSHighResolutionCapable</key><true/>' \
              '</dict></plist>' > "$contents/Info.plist"
            # ditto preserves the bundle structure, symlinks and exec bits inside the zip.
            ditto -c -k --sequesterRsrc --keepParent "$app" "build/GCI-macos-$arch.zip"
          }
          bundle arm64
          bundle x64

      - uses: actions/upload-artifact@v4
        with:
          name: gci-macos
          path: build/GCI-macos-*.zip
          if-no-files-found: error

      # On a version tag, add the bundles to the release the Windows job already created.
      - name: Attach macOS bundles to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload '${{ github.ref_name }}' build/GCI-macos-arm64.zip build/GCI-macos-x64.zip --clobber
